plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'app.gesturetv'
    compileSdk 34
    defaultConfig {
        applicationId "app.gesturetv"
        minSdk 26
        targetSdk 34
        versionCode 15
        versionName "1.0"
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }   // 32-bit TVs (e.g. Philips MT5895) + 64-bit TVs
    }
    androidResources { noCompress += "task" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.lifecycle:lifecycle-service:2.6.2'
    // 0.10.14 is the last MediaPipe release that ships armeabi-v7a (32-bit) native libs
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'
}

// The MediaPipe gesture model (Apache-2.0) is downloaded at build time instead of living in git.
def modelFile = file("src/main/assets/gesture_recognizer.task")
def modelUrl = "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task"
tasks.register('downloadModel') {
    outputs.file(modelFile)
    doLast {
        if (!modelFile.exists()) {
            modelFile.parentFile.mkdirs()
            println "Downloading gesture model…"
            new URL(modelUrl).withInputStream { i -> modelFile.withOutputStream { it << i } }
        }
    }
}
preBuild.dependsOn downloadModel
